# Weekly audit of the README automation: is the daily workflow alive, did it run
# lately, is the README the shape the builder writes, do its links answer, are the
# actions pinned, is the dispatch hook in the project repositories still delivering.
# scripts/audit.sh has the checks; this only runs it and routes a failure to an
# issue. Run it by hand from the Actions tab after changing anything here.

name: Audit README automation

on:
  schedule:
    # Mondays 06:41 UTC = 12:11 IST (no daylight saving in India). Quoted: a bare
    # leading * is a YAML alias.
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # workflow state and run history

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: audit the automation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lines: ${{ steps.audit.outputs.lines }}
      warnings: ${{ steps.audit.outputs.warnings }}
      failures: ${{ steps.audit.outputs.failures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes

      # The audit's warn lines used to exist only in this step's log. A warning does not
      # fail the job, so no issue was opened and no notification was sent, and nobody
      # opens the log of a green run -- which made every warning the audit can raise (a
      # dispatch token never installed, a link a datacenter IP cannot fetch, a scheduler
      # starting to drift) a message written to a place with no reader. Three channels
      # now: the step summary, which is on the run page whatever the verdict; annotations,
      # which show on a green run too; and the failure issue below, which quotes the
      # lines instead of asking the reader to go and find them.
      - name: Run the audit
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          # Every secret the workflows in this repository reference, so the audit can say
          # whether it is set. No token Actions can issue is allowed to list secrets, so
          # without this the weekly run reported "cannot be listed" and the one gap here --
          # no external monitor -- was visible only to somebody running the script by hand.
          # An unset secret arrives as an empty string, which is exactly the test. The audit
          # checks emptiness and never reads the value; keep it that way, and keep this list
          # in step with what the workflows use (the audit says so when it is not).
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        # Through bash: a checkout from Windows may not carry the executable bit.
        run: |
          out="$RUNNER_TEMP/audit.txt"
          status=0
          bash scripts/audit.sh > "$out" 2>&1 || status=$?
          cat "$out"

          failures=$(grep -c '^FAIL ' "$out" || true)
          warnings=$(grep -c '^warn ' "$out" || true)
          notable=$(grep -E '^(FAIL|warn) ' "$out" || true)

          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "$line" in
              FAIL*) echo "::error title=Audit failure::${line#FAIL  }" ;;
              warn*) echo "::warning title=Audit warning::${line#warn  }" ;;
            esac
          done <<< "$notable"

          {
            if [ "$status" -eq 0 ]; then
              echo "## Audit passed"
            else
              echo "## Audit failed"
            fi
            echo
            echo "$failures FAIL, $warnings warn."
            if [ -n "$notable" ]; then
              echo
              echo '```'
              echo "$notable"
              echo '```'
            fi
            echo
            echo '<details><summary>Every line</summary>'
            echo
            echo '```'
            cat "$out"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "failures=$failures"
            echo "warnings=$warnings"
            echo 'lines<<AUDIT_LINES_EOF'
            echo "$notable"
            echo 'AUDIT_LINES_EOF'
          } >> "$GITHUB_OUTPUT"

          exit $status

  report:
    name: open or update the failure issue
    needs: audit
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUDIT_LINES: ${{ needs.audit.outputs.lines }}
          AUDIT_FAILURES: ${{ needs.audit.outputs.failures }}
          AUDIT_WARNINGS: ${{ needs.audit.outputs.warnings }}
        run: |
          title="README automation audit is failing"
          # The lines themselves, not a link to them: an issue that says "open the run"
          # is read once and then ignored, and a notification with no content in it
          # cannot be triaged from a phone. If the job died before it could set its
          # outputs -- a timeout, a runner failure -- say that rather than posting a
          # blank list and implying the audit found nothing.
          lines=${AUDIT_LINES:-}
          if [ -z "$lines" ]; then
            lines="(the audit's own output did not reach this job: it may have timed out or
          the runner may have failed before the audit finished. Open the run.)"
          fi
          body="Run: $RUN_URL

          ${AUDIT_FAILURES:-?} FAIL, ${AUDIT_WARNINGS:-?} warn in scripts/audit.sh:

          \`\`\`
          $lines
          \`\`\`

          This issue is updated by every failed audit and closed by the next passing one."
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
                     --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

  recovered:
    name: close the failure issue
    needs: audit
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="README automation audit is failing"
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" \
          | while read -r number; do
              [ -n "$number" ] || continue
              gh issue close "$number" -R "$GITHUB_REPOSITORY" --comment "Recovered: $RUN_URL passed."
            done
